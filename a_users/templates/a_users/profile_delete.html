{% extends 'layouts/box.html' %}

{% block content %}

<div class="max-w-md mx-auto">
    <h1 class="text-2xl sm:text-3xl text-red-600 dark:text-red-400 mb-2">Eliminar Cuenta</h1>
    <p class="text-slate-600 dark:text-slate-300 mb-6 text-sm sm:text-base">¿Estás completamente seguro de que deseas eliminar tu cuenta? Esta acción no se puede deshacer.</p>

    <form method='POST' class="flex flex-col sm:flex-row gap-3">
        {% csrf_token %}
        <button type="submit" class="button-red w-full sm:w-auto">Sí, eliminar mi cuenta</button>
        <a class="button button-gray text-center w-full sm:w-auto" href="{{ request.META.HTTP_REFERER|default:'/' }}">Cancelar</a>
    </form>
</div>

{% endblock %}
