{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RigLab</title>
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/htmx.org/dist/htmx.js"></script>
    <script src="https://unpkg.com/hyperscript.org@0.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>
    <script>
        // Init theme immediately to avoid FOUC
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style type="text/tailwindcss">
        [x-cloak] { 
            display: none !important; 
        }
        h1 {
            @apply text-3xl sm:text-4xl font-extrabold mb-4 text-slate-900 dark:text-slate-100 tracking-tight
        }
        h2 {
            @apply text-xl sm:text-2xl font-bold mb-2 text-slate-800 dark:text-slate-200 tracking-tight
        }
        p {
            @apply mb-4 text-slate-600 dark:text-slate-300 leading-relaxed
        }
        .button, button, [type='submit'], [type='button'] {
            @apply bg-slate-900 hover:bg-slate-800 active:scale-95 text-white dark:bg-slate-100 dark:hover:bg-white dark:text-slate-900 font-semibold px-5 py-2.5 sm:px-6 sm:py-3 inline-flex items-center justify-center gap-2 rounded-lg shadow-sm transition-all cursor-pointer text-sm
        }
        .button.alert, button.alert {
            @apply bg-rose-600 hover:bg-rose-700 text-white dark:bg-rose-600 dark:hover:bg-rose-700
        }
        .button-red {
            @apply !bg-rose-50 hover:!bg-rose-100 text-rose-700 border border-rose-200 dark:!bg-rose-950/40 dark:hover:!bg-rose-900/50 dark:text-rose-300 dark:border-rose-900/60
        }
        .button-gray {
            @apply !bg-slate-100 hover:!bg-slate-200 text-slate-700 dark:!bg-slate-800 dark:hover:!bg-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 font-medium
        }
        .navitems>li>a {
            @apply flex items-center gap-2 h-10 sm:h-11 px-3 sm:px-4 rounded-lg text-slate-700 dark:text-slate-200 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors font-medium text-sm;
        }
        .hoverlist>* {
            @apply hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition duration-150;
        }
        .hoverlist>*>a {
            @apply flex items-center p-2.5 text-slate-700 dark:text-slate-200 font-medium text-sm;
        }
        .highlight {
            @apply !bg-indigo-50 dark:!bg-indigo-950/50 text-indigo-900 dark:text-indigo-200;
        }
        .allauth content a {
            @apply underline underline-offset-4 text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 font-medium
        }
        .allauth form[action="/accounts/signup/"] ul {
            @apply hidden
        }
        .allauth form[action="/accounts/signup/"] ul.errorlist {
            @apply block
        }
        .allauth .helptext {
            @apply block mt-1.5 text-xs text-slate-500 dark:text-slate-400
        }
        label {
            @apply block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5 font-mono
        }
        input[type=file] {
            @apply bg-transparent pl-0 text-slate-600 dark:text-slate-300 text-sm
        }
        .form-input, .form-select, .form-textarea, .textarea, textarea, select, input:not([type='checkbox']):not([type='radio']):not([type='submit']):not([type='button']) {
            @apply w-full rounded-xl py-2.5 px-3.5 bg-slate-50 dark:bg-slate-900/90 text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-400/50 focus:border-indigo-500 transition text-sm font-sans shadow-sm placeholder:text-slate-400 dark:placeholder:text-slate-600
        }
        .form-checkbox, input[type='checkbox'] {
            @apply rounded-md border-slate-300 dark:border-slate-700 text-indigo-600 dark:text-indigo-500 focus:ring-indigo-500 w-4 h-4
        }
        .errorlist li {
            @apply p-2.5 pl-4 border-l-rose-500 border-l-4 border-solid mb-2 text-rose-700 dark:text-rose-300 bg-rose-50 dark:bg-rose-950/40 text-xs rounded-r-xl font-medium
        }
        label[for="id_remember"] {
            @apply inline-block w-auto mr-2 text-slate-600 dark:text-slate-300 font-sans normal-case text-sm
        }
        input[name="remember"] {
            @apply w-auto rounded text-indigo-600 focus:ring-indigo-500
        }
        .alert-info { @apply bg-sky-50 dark:bg-sky-950/40 text-sky-800 dark:text-sky-200 border border-sky-200 dark:border-sky-900/50 }
        .alert-success { @apply bg-emerald-50 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-200 border border-emerald-200 dark:border-emerald-900/50 }
        .alert-warning { @apply bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-200 border border-amber-200 dark:border-amber-900/50 }
        .alert-danger { @apply bg-rose-50 dark:bg-rose-950/40 text-rose-800 dark:text-rose-200 border border-rose-200 dark:border-rose-900/50 }
    </style>
</head>
<body class="bg-slate-50/80 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200 antialiased {% block class %}{% endblock %}">
	
    {% include 'includes/messages.html' %}

    {% include 'includes/header.html' %}

    {% block layout %}
    {% endblock %}

    {% block javascript %} {% endblock %}

</body>
</html>
