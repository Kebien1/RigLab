<div class="fade-in-up">
    {% include 'a_rtchat/mensaje_chat.html' %}
</div>

{% if sesion_actual %}
<div id="bot-thinking-{{ mensaje.id }}" 
     hx-get="{% url 'generar-respuesta' sesion_actual.id_sesion mensaje.id %}" 
     hx-trigger="load" 
     hx-swap="outerHTML">
    <li class="flex items-start gap-2.5 sm:gap-3 mt-5 fade-in-up">
        <div class="mt-1 shrink-0 h-8 w-8 sm:h-9 sm:w-9 rounded-full bg-gradient-to-br from-emerald-400 to-teal-500 flex items-center justify-center text-white font-bold text-[10px] sm:text-xs shadow-sm border border-emerald-300 dark:border-emerald-600">
            IA
        </div>
        <div class="min-w-0 max-w-[88%] sm:max-w-[75%]">
            <div class="mb-1 flex items-center gap-2 text-xs">
                <span class="font-semibold text-emerald-700 dark:text-emerald-300">Venk IA</span>
            </div>
            <div class="break-words rounded-2xl rounded-tl-sm bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/60 px-4 py-2.5 sm:py-3 text-sm leading-relaxed text-slate-900 dark:text-slate-100 shadow-sm flex gap-1.5 items-center h-10">
                <span class="animate-bounce inline-block w-2 h-2 bg-slate-400 dark:bg-slate-500 rounded-full"></span>
                <span class="animate-bounce inline-block w-2 h-2 bg-slate-400 dark:bg-slate-500 rounded-full" style="animation-delay: 0.2s"></span>
                <span class="animate-bounce inline-block w-2 h-2 bg-slate-400 dark:bg-slate-500 rounded-full" style="animation-delay: 0.4s"></span>
            </div>
        </div>
    </li>
</div>
{% endif %}

<style>
    @keyframes fadeInAndUp {
        from {
            opacity: 0;
            transform: translateY(12px);
        }
        to {
            opacity: 1;
            transform: translateY(0px);
        }
    }
    .fade-in-up {
        animation: fadeInAndUp 0.6s ease;
    }
</style>

<script>scrollToBottom()</script>
